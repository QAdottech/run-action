name: "QA.tech Change Review Prepare"
description: "Prepare a QA.tech change review before the preview deployment is ready."
author: "QA Tech AB"

inputs:
  project_short_id:
    description: "The QA.tech project short ID."
    required: true
  api_token:
    description: "The API key for the QA.tech project."
    required: true
  api_url:
    description: "The API url for QA.techs API. Defaults to production."
    required: false
  context:
    description: "Optional free-form context appended to the change review."
    required: false
  commit_hash:
    description: "PR head commit SHA (pull_request.head.sha). Sent as API commitHash so prepare and review apply to that commit."
    required: false
  pr_url:
    description: "Pull request URL to review. Defaults to the URL of the pull_request event when available."
    required: false
  disable_review_comments:
    description: "When true, the agent does not post review comments on the pull request. The review still runs and is shown in QA.tech, and the PR Review check is still reported. Stored on the PR's review conversation, so later reviews stay silent until a request sends false. Defaults to posting comments."
    required: false

outputs:
  chat_created:
    description: "Whether the change review chat was created successfully."
  chat_short_id:
    description: "The short ID of the change review chat conversation."
  chat_url:
    description: "The dashboard URL of the change review chat."

branding:
  icon: "git-pull-request"
  color: "black"

runs:
  using: "node20"
  main: "../dist/change-review-prepare/index.js"
